[project]
name = "github-gchat-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "pratham.taheem@hotwax.co" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-apps-chat>=0.10.7",
    "google-auth>=2.60.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
github-gchat-agent = "github_gchat_agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
